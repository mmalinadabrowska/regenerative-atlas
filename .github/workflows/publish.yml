# Bringing the accepted entries out onto the map.
#
# The site is static. What it draws is public/data/snapshot.json, a baked copy
# of the library that is committed to this repository — which is why the Atlas
# can be served from anywhere, and why accepting a submission does not, by
# itself, put it on the map. Accepting writes it to the Supabase project; this
# is what carries it the last step, on its own, about once an hour:
#
#   seed a fresh database  →  pull the project into it  →  bake the snapshot
#   →  commit it if it changed, which is the push the host redeploys from.
#
# It reads with the anon key, which is the read-only one, and which is all this
# needs: the published library is public by policy. The service role key — the
# one that writes — is not here and has no business being here.
#
# Set two repository secrets to turn this on (Settings → Secrets and variables
# → Actions): SUPABASE_URL and SUPABASE_ANON_KEY. Without them each run leaves a
# notice saying so and skips the rest — green, not red, because nothing is
# broken; it has simply not been switched on.

name: publish

on:
  schedule:
    # Seventeen past, rather than on the hour, where every other scheduled job
    # in the world is queuing.
    - cron: '17 * * * *'
  workflow_dispatch:

# One at a time: two runs racing each other would each commit a snapshot built
# without the other's entries.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      # Not set up yet is not a failure. Before the two secrets exist this job
      # ran hourly and went red every time, which is a great deal of noise
      # about something that has not been started. It now says so once per run
      # and stands down; everything after it is skipped.
      - name: Is there a project to publish from?
        id: ready
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::notice::No Supabase secrets yet (SUPABASE_URL, SUPABASE_ANON_KEY under Settings → Secrets and variables → Actions), so there is nothing to publish from. Skipping."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the library from the project
        if: steps.ready.outputs.go == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          npm run reset
          npm run supabase pull
          npm run build-static

      - name: Commit the snapshot, if it moved
        if: steps.ready.outputs.go == 'true'
        run: |
          if git diff --quiet -- public/data/snapshot.json; then
            echo "Nothing new — the map already shows everything the project holds."
            exit 0
          fi
          # The snapshot records when it was built, and this job seeds a fresh
          # database each run, so every record is stamped with the time of the
          # run too. It therefore differs on every run even when the library
          # does not. Compared without those stamps: if they are all that moved,
          # there is nothing to publish — and no commit, because every commit
          # here is a redeploy of the site.
          stamps='walk(if type == "object" then del(.created_at, .updated_at) else . end) | del(.builtAt, .graph.generatedAt)'
          if diff -q \
            <(git show HEAD:public/data/snapshot.json | jq -S "$stamps") \
            <(jq -S "$stamps" public/data/snapshot.json) > /dev/null; then
            echo "Only the build time moved — the map already shows everything the project holds."
            git checkout -- public/data/snapshot.json
            exit 0
          fi
          git config user.name  'Regenerative Atlas'
          git config user.email 'actions@users.noreply.github.com'
          git add public/data/snapshot.json
          git commit \
            -m 'Publish the library as it stands' \
            -m 'Built from the Supabase project by the scheduled publish, so that entries accepted since the last one are on the map.'
          git push
