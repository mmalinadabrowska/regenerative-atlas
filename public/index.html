<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dial Up</title>
  <meta name="description" content="Dial Up">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- The modem handshake, drawn as a spectrogram: time runs left to right,
       pitch bottom to top. Built by scripts/render-video.sh. -->
  <video class="backdrop" poster="media/poster.jpg"
         autoplay muted loop playsinline aria-hidden="true">
    <source src="media/handshake.webm" type="video/webm">
    <source src="media/handshake.mp4" type="video/mp4">
  </video>

  <main>
    <h1>Dial Up</h1>
  </main>

  <footer>
    <!-- TODO: replace with the real contact address -->
    <a href="mailto:hello@example.com">say hello</a>
  </footer>

  <script>
    // Respect reduced-motion: hold the still frame instead of scrolling.
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const v = document.querySelector('.backdrop');
      v.removeAttribute('autoplay');
      v.pause();
    }
  </script>
</body>
</html>
