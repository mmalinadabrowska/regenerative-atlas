<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Map · Regenerative Atlas</title>
<meta name="description" content="A connection map of regenerative research, clustered by shared vocabulary.">
<link rel="stylesheet" href="/styles/atlas.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body class="page">

<header class="topbar">
  <a class="topbar__brand" href="/">Regenerative Atlas</a>
  <nav class="navgroup" data-connected-nav aria-label="Sections of the Atlas">
    <a class="navgroup__mark" data-connect href="/" aria-label="Atlas home"><svg viewBox="-11 -11 22 22" aria-hidden="true"><path d="M -5 -5 A 5 5 0 0 1 5 -5 A 5 5 0 0 1 5 5 A 5 5 0 0 1 -5 5 A 5 5 0 0 1 -5 -5 Z"/></svg></a>
    <a data-connect href="/map" aria-current="page">Explore</a>
    <a data-connect href="/themes">Themes</a>
    <a data-connect href="/add">Add</a>
  </nav>
  <span class="topbar__count" data-count></span>
</header>

<div class="map-shell">
  <canvas id="constellation" aria-label="Connection map of the Atlas. A list of every source is available on the Themes page."></canvas>

  <div class="map-controls">
    <input id="map-search" class="map-search" type="search" placeholder="Search the library…" aria-label="Search the library">
    <div id="map-filters" class="tag-cloud" aria-label="Filter by tag"></div>
    <button class="chip" id="map-clear" type="button" hidden>Clear</button>
    <button class="chip" id="map-out" type="button" aria-label="Zoom out">&minus;</button>
    <button class="chip" id="map-in" type="button" aria-label="Zoom in">+</button>
    <button class="chip" id="map-reset" type="button">Recentre</button>
  </div>

  <div class="map-legend" id="map-legend"></div>

  <aside class="panel" id="panel" aria-live="polite">
    <button class="sheet-grip" id="sheet-grip" type="button" aria-expanded="false" aria-controls="panel-body">
      <span class="sheet-grip__bar" aria-hidden="true"></span>
      <span class="visually-hidden">Expand the details</span>
    </button>
    <button class="panel__close" id="panel-close" type="button" aria-label="Close">×</button>
    <div id="panel-body"></div>
  </aside>
</div>

<script type="module" src="/js/map.js"></script>
<script type="module" src="/js/connected-nav.js"></script>
</body>
</html>
