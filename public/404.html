<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not here · Regenerative Atlas</title>
<link rel="preload" as="font" type="font/woff2" crossorigin
      href="/fonts/tremplin/webfont/Tremplin-Regular.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin
      href="/fonts/enby-gertrude/webfonts/woff2/Enby_Gertrude_roman.woff2">
<link rel="stylesheet" href="/styles/atlas.css">
<!-- Shown only once its typefaces are here, so the Atlas is never set in a
     stand-in: both faces are preloaded above, so this is normally a moment,
     and after the first visit nothing at all. Eight seconds is the most it will
     ever wait, so a font that cannot arrive never keeps the page from showing. -->
<script>
  (function () {
    var root = document.documentElement;
    if (!document.fonts || !document.fonts.load) return;
    root.classList.add('fonts-pending');
    var show = function () { root.classList.remove('fonts-pending'); };
    Promise.all([
      document.fonts.load('400 1em "Enby Gertrude"'),
      document.fonts.load('400 1em "Tremplin"'),
    ]).then(show, show);
    setTimeout(show, 8000);
  })();
</script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- Vercel Web Analytics: page views, counted without cookies. Served by
     Vercel itself from /_vercel/insights, so it needs no package and no build;
     anywhere else (the local server, a copy of the folder) it is simply absent. -->
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
