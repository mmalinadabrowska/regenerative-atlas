<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Themes · Regenerative Atlas</title>
<meta name="description" content="Search for keywords across the existing library of regenerative research.">
<!-- Fetched with the page, so the nav's curve is drawn in the same frame the
     row first appears in rather than a frame or two after it. -->
<link rel="modulepreload" href="/js/connected-nav.js">
<link rel="preload" as="font" type="font/woff2" crossorigin
      href="/fonts/tremplin/webfont/Tremplin-Regular.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin
      href="/fonts/enby-gertrude/webfonts/woff2/Enby_Gertrude_roman.woff2">
<link rel="stylesheet" href="/styles/atlas.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body class="page">

<header class="topbar">
  <!-- Who this is, and the way back to it: the Atlas' mark in the circle it
       wears everywhere else on the site, and the name beside it. -->
  <div class="topbar__id">
    <a class="atlas-mark" href="/" aria-label="Regenerative Atlas home">
      <svg viewBox="-11 -11 22 22" aria-hidden="true" focusable="false">
        <path d="M -5 -5 A 5 5 0 0 1 5 -5 A 5 5 0 0 1 5 5 A 5 5 0 0 1 -5 5 A 5 5 0 0 1 -5 -5 Z"/>
      </svg>
    </a>
    <a class="topbar__brand" href="/">Regenerative Atlas</a>
  </div>
  <nav class="navgroup" data-connected-nav aria-label="Sections of the Atlas">
    <a data-connect href="/map/">Explore</a>
    <a data-connect href="/add/">Add</a>
    <a data-connect href="/about/">About</a>
  </nav>
  <span class="topbar__count" data-count></span>
</header>

<main class="sheet">
  <div class="masthead masthead--left" style="padding-inline:0">
    <h1 class="wordmark" style="font-size:clamp(2rem,4.5vw,3.2rem)">Themes</h1>
    <p class="blurb">Search for keywords across the existing library of research, or pick your way
      through the vocabulary the Atlas has grown. Every tag is a door into the map.</p>
  </div>

  <form id="search-form" role="search" style="margin:2rem 0 0">
    <div class="pill-field">
      <input id="search" type="search" placeholder="soil, embodied carbon, reuse…" aria-label="Search the library">
      <button type="submit">Search</button>
    </div>
  </form>

  <div id="facets"></div>

  <div class="section-head">
    <h2 id="results-heading">The library</h2>
    <p id="results-count"></p>
    <p style="margin-left:auto"><a href="/api/export.json">JSON</a> · <a href="/api/export.bib">BibTeX</a></p>
  </div>

  <ul class="records" id="results"></ul>
</main>

<script type="module" src="/js/themes.js"></script>
<script type="module" src="/js/connected-nav.js"></script>
</body>
</html>
