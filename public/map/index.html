<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Map · Regenerative Atlas</title>
<meta name="description" content="A connection map of regenerative research, clustered by shared vocabulary.">
<!-- Fetched with the page, so the nav's curve is drawn in the same frame the
     row first appears in rather than a frame or two after it. -->
<link rel="modulepreload" href="/js/connected-nav.js">
<link rel="preload" as="font" type="font/woff2" crossorigin
      href="/fonts/tremplin/webfont/Tremplin-Regular.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin
      href="/fonts/enby-gertrude/webfonts/woff2/Enby_Gertrude_roman.woff2">
<link rel="stylesheet" href="/styles/atlas.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body class="page page--map">

<header class="topbar">
  <!-- Who this is, and the way back to it: the Atlas' mark in the circle it
       wears everywhere else on the site, and the name beside it. -->
  <div class="topbar__id">
    <a class="atlas-mark" href="/" aria-label="Regenerative Atlas home">
      <svg viewBox="-11 -11 22 22" aria-hidden="true" focusable="false">
        <path d="M -5 -5 A 5 5 0 0 1 5 -5 A 5 5 0 0 1 5 5 A 5 5 0 0 1 -5 5 A 5 5 0 0 1 -5 -5 Z"/>
      </svg>
    </a>
    <a class="topbar__brand" href="/">Regenerative Atlas</a>
  </div>
  <nav class="navgroup" data-connected-nav aria-label="Sections of the Atlas">
    <a data-connect href="/map/" aria-current="page">Explore</a>
    <a data-connect href="/add/">Add</a>
    <a data-connect href="/about/">About</a>
  </nav>
  <span class="topbar__count" data-count></span>
</header>

<div class="map-shell">
  <canvas id="constellation" aria-label="Connection map of the Atlas. A list of every source is available on the Themes page."></canvas>

  <div class="map-chrome">
    <div class="map-controls">
      <!-- Searching is a thing you go and do, not a field standing open on the
           chance that you might: the button opens the drawer the map's records
           already come up in, and the typing happens there. -->
      <button class="chip chip--icon" id="map-search-open" type="button"
              aria-label="Search the library" aria-expanded="false" aria-controls="panel">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4 L21 21"/>
        </svg>
      </button>
      <!-- Filled, and first in the row: it is the way back from a filtered map
           to the whole library, and the one control here you need most when you
           can least see what is going on. -->
      <button class="chip chip--filled" id="map-clear" type="button" hidden>Clear</button>
      <span class="tag-bar__name" id="tag-bar-name">Tags</span>
      <div id="map-filters" class="tag-cloud" aria-labelledby="tag-bar-name"></div>
      <!-- One button for two jobs: the rest of the tags on a wide screen, and the
           whole list on a narrow one, where there is no room for a row of them. -->
      <button class="chip chip--more" id="map-more" type="button" aria-expanded="false" aria-controls="tag-drawer">
        <span class="chip--more__wide">More</span>
        <span class="chip--more__narrow">Tags</span>
        <svg class="chip__caret" viewBox="0 0 12 8" aria-hidden="true" focusable="false"><path d="M1 1.5 6 6.5 11 1.5"/></svg>
      </button>
      <!-- Where the work is grounded. A second, shorter group in the same row:
           a place is not a subject, and asking for both at once is the whole
           point of keeping them apart. -->
      <span class="tag-bar__name" id="place-bar-name">Location</span>
      <div id="map-places" class="tag-cloud" aria-labelledby="place-bar-name"></div>
      <button class="chip chip--more" id="map-place-more" type="button" aria-expanded="false" aria-controls="place-drawer">
        <span class="chip--more__wide">More</span>
        <span class="chip--more__narrow">Location</span>
        <svg class="chip__caret" viewBox="0 0 12 8" aria-hidden="true" focusable="false"><path d="M1 1.5 6 6.5 11 1.5"/></svg>
      </button>
      <!-- On a phone this cluster leaves the scrolling row and floats over the
           map, where it can always be reached. -->
      <div class="map-zoom">
        <!-- Drawn, not set: a font's minus and plus sit on its mathematical
             axis, which is not the middle of a circle. Two strokes have a
             middle, and they match the weight of the mark beside them. -->
        <button class="chip chip--round" id="map-out" type="button" title="Zoom out" aria-label="Zoom out">
          <svg class="chip__mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12H19"/></svg>
        </button>
        <button class="chip chip--round" id="map-in" type="button" title="Zoom in" aria-label="Zoom in">
          <svg class="chip__mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5V19M5 12H19"/></svg>
        </button>
        <button class="chip chip--round" id="map-reset" type="button" title="Recentre" aria-label="Recentre the map">
          <svg class="chip__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/>
            <circle cx="12" cy="12" r="2.1"/>
          </svg>
          <span class="chip__label">Recentre</span>
        </button>
      </div>
    </div>

    <div class="tag-drawer" id="tag-drawer" hidden>
      <div class="tag-cloud" id="tag-drawer-list" aria-label="Every tag in the library"></div>
    </div>

    <div class="tag-drawer" id="place-drawer" hidden>
      <div class="tag-cloud" id="place-drawer-list" aria-label="Everywhere the library is grounded"></div>
    </div>
  </div>

  <!-- When the filters meet in a place the library has nothing in, the map is
       empty ground and says nothing at all. This is what it says instead:
       what happened, and the one way out of it. -->
  <div class="map-empty" id="map-empty" role="status" hidden>
    <p class="map-empty__text">Nothing found in the library matching your search.</p>
    <button class="chip" id="map-empty-clear" type="button">Clear</button>
  </div>

  <div class="map-legend" id="map-legend"></div>

  <aside class="panel" id="panel" aria-live="polite">
    <button class="sheet-grip" id="sheet-grip" type="button" aria-expanded="false" aria-controls="panel-body">
      <span class="sheet-grip__bar" aria-hidden="true"></span>
      <span class="visually-hidden">Expand the details</span>
    </button>
    <header class="panel__head" id="panel-head">
      <span class="panel__glyph" id="panel-glyph" aria-hidden="true"></span>
      <h3 class="panel__title" id="panel-title"></h3>
      <!-- The drawer's other head: when what is open is a search, the thing
           you are reading is what you are typing. -->
      <input class="panel__search" id="panel-search" type="search"
             placeholder="search the library…" aria-label="Search the library"
             autocomplete="off" spellcheck="false">
      <!-- The address of where you have got to. A map you can travel through
           and not send anyone is a map you explored alone. -->
      <button class="panel__share" id="panel-share" type="button"
              aria-label="Copy a link to this view">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M10 13.6a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1.3 1.3"/>
          <path d="M14 10.4a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1.3-1.3"/>
        </svg>
      </button>
      <button class="panel__close" id="panel-close" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M5 5 L19 19 M19 5 L5 19"/>
        </svg>
      </button>
      <!-- What just happened, said under the bar it happened on. Always here,
           so that it has something to fade from. -->
      <p class="panel__said" id="panel-said" role="status" aria-live="polite"></p>
    </header>
    <div class="panel__scroll">
      <div id="panel-body"></div>
      <div class="scroll-rail" id="scroll-rail" aria-hidden="true">
        <span class="scroll-rail__dot" id="scroll-dot"></span>
      </div>
    </div>
  </aside>
</div>

<script type="module" src="/js/map.js"></script>
<script type="module" src="/js/connected-nav.js"></script>
</body>
</html>
